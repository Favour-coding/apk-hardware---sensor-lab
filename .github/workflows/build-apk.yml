name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2.2'

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Locate Debug APK
        id: locate_apk
        run: |
          APK_FILE=$(find app/build/outputs/apk/debug/ -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "Error: No APK file found in app/build/outputs/apk/debug/"
            exit 1
          fi
          echo "Found APK at: $APK_FILE"
          echo "apk_path=$APK_FILE" >> $GITHUB_OUTPUT

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Hardware & Sensor Lab Build #${{ github.run_number }}"
          body: |
            ### Android APK Build #${{ github.run_number }}
            - **App Name:** Hardware & Sensor Lab
            - **Commit:** `${{ github.sha }}`
            - **Trigger:** Automated build by **HTML to APK Studio**
            
            ---
            *Note: This is a debug-signed APK. When installing on your Android device, you may need to allow unknown apps in Settings and tap "Install anyway" on Google Play Protect.*
          files: ${{ steps.locate_apk.outputs.apk_path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
